limit_req_zone $binary_remote_addr zone=canteen_login:5m rate=20r/m;
server {
    listen 80;
    server_name 116.62.84.213;
    root /var/www/canteen-demo;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;
    add_header X-Content-Type-Options nosniff;
    location = /mobile { return 301 /mobile/; }
    location ^~ /mobile/ { try_files $uri $uri/ =404; }
    location ^~ /demo-img/ { try_files $uri =404; }
    location = /demo-api/account/login {
        limit_req zone=canteen_login burst=20 nodelay;
        proxy_pass http://127.0.0.1:18180;
    }
    location ^~ /demo-api/ { proxy_pass http://127.0.0.1:18180; }
    location / { try_files $uri $uri/ /index.html; }
}
